name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate HTML
        run: npx htmlhint **/*.html || true

      - name: Verify HTML Files
        run: test -f index.html && echo 'index.html verified'

      - name: Build Container Image
        run: docker build -t natural-ci-cd-pipeline-ai .

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Static Site
        run: echo 'Deploy static web assets'