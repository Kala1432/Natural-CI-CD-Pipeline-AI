name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ec2-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          port: ${{ secrets.EC2_PORT }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            REPO_URL="https://github.com/Kala1432/Natural-CI-CD-Pipeline-AI.git"
            APP_DIR="$HOME/natural-ci-cd-pipeline-ai"

            echo "======================================"
            echo "Starting deployment"
            echo "======================================"

            # --------------------------------------------
            # Check Docker
            # --------------------------------------------
            echo "Checking Docker..."

            docker --version
            docker compose version

            # --------------------------------------------
            # Clone repository on first deployment
            # --------------------------------------------
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Cloning repository..."
              git clone "$REPO_URL" "$APP_DIR"
            else
              echo "Repository already exists."
            fi

            cd "$APP_DIR"

            # --------------------------------------------
            # Get latest code
            # --------------------------------------------
            echo "Updating repository..."

            git fetch origin
            git reset --hard origin/main

            # --------------------------------------------
            # Stop old containers
            # --------------------------------------------
            echo "Stopping existing containers..."

            docker compose down --remove-orphans || true

            # --------------------------------------------
            # Build and start application
            # --------------------------------------------
            echo "Building and starting application..."

            docker compose up -d --build

            # --------------------------------------------
            # Show deployment status
            # --------------------------------------------
            echo "Checking running containers..."

            docker compose ps

            # --------------------------------------------
            # Basic validation
            # --------------------------------------------
            sleep 10

            if docker compose ps --status running | grep -q .; then
              echo "======================================"
              echo "Deployment successful"
              echo "======================================"
            else
              echo "======================================"
              echo "Deployment failed"
              echo "======================================"

              echo "Container logs:"
              docker compose logs --tail=100

              exit 1
            fi
