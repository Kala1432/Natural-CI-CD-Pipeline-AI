services:
  backend:
    build: .
    ports:
      - "5001:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/pipeline_sh
      - MONGODB_URI=mongodb://mongodb:27017/pipeline_sh
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=hifi_jwt_secret_change_in_prod
      - SECRET_KEY=hifi_flask_secret_change_in_prod
      - AWS_REGION=us-east-1
      - FRONTEND_URL=http://13.51.172.247:8080
      - BACKEND_URL=http://13.51.172.247:5001
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_APP_PASSWORD=${SMTP_APP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_VERIFICATION_REQUIRED=${EMAIL_VERIFICATION_REQUIRED:-false}
      - MAIL_SUPPRESS_SEND=${MAIL_SUPPRESS_SEND:-false}
      - OTP_EXPIRY_MINUTES=${OTP_EXPIRY_MINUTES:-10}
      - OTP_RESEND_COOLDOWN_SECONDS=${OTP_RESEND_COOLDOWN_SECONDS:-60}
      - OTP_MAX_ATTEMPTS=${OTP_MAX_ATTEMPTS:-5}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
      - AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID:-}
      - AWS_EC2_INSTANCE_ID=${AWS_EC2_INSTANCE_ID:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started

  # Celery worker — runs the heavy `analyze_repo`, `run_simulation`, etc. tasks
  # in the background so the Flask request returns immediately.
  celery_worker:
    build: .
    command: celery -A backend.celery_app.celery_app worker --loglevel=INFO --pool=solo --concurrency=2
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/pipeline_sh
      - MONGODB_URI=mongodb://mongodb:27017/pipeline_sh
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=hifi_jwt_secret_change_in_prod
      - SECRET_KEY=hifi_flask_secret_change_in_prod
      - AWS_REGION=us-east-1
      - FRONTEND_URL=http://13.51.172.247:8080
      - BACKEND_URL=http://13.51.172.247:5001
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
      - AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "3001:4173"
    environment:
      - VITE_PROXY_TARGET=http://backend:5000
    depends_on:
      - backend

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pipeline_sh
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  db_data:
  mongodb_data:
